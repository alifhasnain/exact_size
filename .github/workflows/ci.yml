name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml # pinned Flutter (ADR-001)
          cache: true
      - run: flutter pub get
      - name: Resolve es_codec dev tools (ffigen, jnigen) for analysis
        run: flutter pub get --directory packages/es_codec
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      - name: Release APK for arm, arm64, x64
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - name: Native tree shaking (record_use)
        run: tool/check_tree_shaking.sh

  emulator:
    name: Interop test on API 28 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          ram-size: 2048M # 2 GB emulator profile (PRD test environment)
          script: flutter test integration_test/interop_test.dart --dart-define=EXPECTED_SDK_INT=28
