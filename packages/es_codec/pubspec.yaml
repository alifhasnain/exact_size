name: es_codec
description: "Native image codec bindings for ExactSize (libjpeg-turbo, stb_image_resize2) via Dart FFI. Filled in FEAT-004-T03/T05."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.14.0
  flutter: 3.50.1
dependencies:
  code_assets: 2.2.0
  crypto: 3.0.8
  ffi: 2.2.0
  flutter:
    sdk: flutter
  hooks: 2.2.0
  jni: 1.2.1
  meta: 1.19.0
  native_toolchain_c: 0.19.6
  record_use: 1.1.1
dev_dependencies:
  ffigen: 23.0.0
  jnigen: 1.1.0

flutter:
  # Licence texts of the bundled native code, shown on the app's licence page.
  assets:
    - third_party/libjpeg-turbo/LICENSE.md
    - third_party/libjpeg-turbo/README.ijg
    - third_party/libjpeg-turbo/src/spng/LICENSE
    - third_party/libjpeg-turbo/src/spng/libpng-LICENSE.txt
    - third_party/libjpeg-turbo/src/spng/zlib/LICENSE
