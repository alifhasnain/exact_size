name: exact_size
description: "ExactSize: resize and compress photos and signatures to exact pixel and KB targets, on device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.1 # pinned (ADR-001); CI reads this version

dependencies:
  flutter:
    sdk: flutter
  cupertino_ui: 1.1.7
  flutter_localizations:
    sdk: flutter
  ffi: 2.2.0 # native PixelBuffer memory (ADR-003)
  flutter_riverpod: 3.5.0
  get_it: 9.3.0
  image: 4.13.1 # exact pin (ADR-002, FEAT-004-T07), MIT licence
  injectable: 3.0.0
  intl: 0.20.3
  material_ui: 1.11.1
  es_codec:
    path: packages/es_codec
  path_provider: 2.1.6 # app cache dir for temp output (FEAT-004-T17)
  jni: 1.2.1 # JNIgen runtime for the crop data layer (FEAT-002-T12); same version as es_codec
  jni_flutter: 1.1.0 # Android application Context for JNIgen calls (moved out of jni in 1.0)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  injectable_generator: 3.1.3
  build_runner: 2.16.1
  crypto: 3.0.8 # SHA-256 of golden outputs (FEAT-004-T22); already in the lock file
  integration_test:
    sdk: flutter
  flutter_driver: # share driver needs its own driver loop (FEAT-001-T25)
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/BarlowCondensed-OFL.txt
  fonts:
    # Spec numerals on the crop screen (OFL 1.1, google/fonts ofl/barlowcondensed).
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
